parameters:
  - name: releaseBuildId
    type: number
    default: 0
  - name: health
    type: boolean
    default: false
  - name: mode
    displayName: Mode
    type: string
    default: Dry run
    values: [Dry run, Integration tests]
  - name: testScenarios
    displayName: Scenarios
    type: object
    default: [edge]
  - name: runtimeChannels
    displayName: Runtime channels
    type: object
    default: [stable]
  - name: pythonVersions
    displayName: Python versions
    type: object
    default: ['3.13']
  - name: upgradeBaselines
    displayName: Upgrade baselines (JSON)
    type: string
    default: '{}'
  - name: scenarioTimeoutMinutes
    displayName: Timeout (min)
    type: number
    default: 360
    values: [90, 180, 360]
  - name: clusterRegion
    type: string
    default: westus2
  - name: azureServiceConnection
    displayName: Service connection
    type: string
    default: az-iot-ops-int-sp-ado
  - name: subscriptionId
    type: string
    default: a386d5ea-ea90-441a-8263-d816368c84a1
  - name: resourceGroup
    type: string
    default: ops-cli-int-test-rg
  - name: customLocationsObjectId
    type: string
    default: 51dfe1e8-70c6-4de5-a08e-e18aff23d815

variables:
  - ${{ if parameters.health }}:
      - group: iot-ops-cli-integration-health

stages:
  - stage: Plan
    displayName: Plan
    jobs:
      - job: Plan
        steps:
          - task: UsePythonVersion@0
            displayName: Select Python
            inputs:
              versionSpec: '3.13'
          - bash: python -m pip install PyYAML
            displayName: Install dependencies
          - ${{ if parameters.health }}:
              - task: DownloadPipelineArtifact@2
                displayName: Download artifacts
                condition: gt(variables['System.JobAttempt'], 1)
                inputs:
                  buildType: current
                  itemPattern: ops-plan-*/**
                  targetPath: $(Pipeline.Workspace)/health-history
          - bash: python tools/ado_integration.py plan --output plan
            name: plan
            displayName: Check matrix
            env:
              OPS_RELEASE_BUILD_ID: ${{ parameters.releaseBuildId }}
              OPS_MODE: ${{ parameters.mode }}
              OPS_SCENARIOS: ${{ join(',', parameters.testScenarios) }}
              OPS_CHANNELS: ${{ join(',', parameters.runtimeChannels) }}
              OPS_PYTHONS: ${{ join(',', parameters.pythonVersions) }}
              OPS_BASELINES: ${{ parameters.upgradeBaselines }}
              OPS_SUBSCRIPTION: ${{ parameters.subscriptionId }}
              OPS_RESOURCE_GROUP: ${{ parameters.resourceGroup }}
              OPS_CLUSTER_REGION: ${{ parameters.clusterRegion }}
              OPS_CUSTOM_LOCATIONS_OID: ${{ parameters.customLocationsObjectId }}
              OPS_SCENARIO_TIMEOUT_MINUTES: ${{ parameters.scenarioTimeoutMinutes }}
              ${{ if parameters.health }}:
                VALIDATION_PROFILES: $(ValidationProfiles)
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                OPS_HEALTH_HISTORY: $(Pipeline.Workspace)/health-history
          - publish: plan
            displayName: Publish plan
            artifact: ops-plan-$(System.JobAttempt)
          - bash: python tools/ado_integration.py title --output plan
            displayName: Set run title
            env:
              OPS_MODE: ${{ parameters.mode }}

  - ${{ if eq(parameters.mode, 'Integration tests') }}:
      - stage: Build
        displayName: Build
        dependsOn: Plan
        jobs:
          - job: Build
            timeoutInMinutes: 30
            steps:
              - task: UsePythonVersion@0
                displayName: Select Python
                inputs:
                  versionSpec: '3.13'
              - ${{ if eq(parameters.releaseBuildId, 0) }}:
                  - bash: |
                      set -euo pipefail
                      python -m pip install build PyYAML
                      python -m build --wheel
                      python tools/ado_integration.py candidate --output dist
                    name: candidate
                    displayName: Build wheel
              - ${{ if ne(parameters.releaseBuildId, 0) }}:
                  - task: DownloadPipelineArtifact@2
                    displayName: Download artifacts
                    inputs:
                      buildType: specific
                      project: $(System.TeamProjectId)
                      definition: "165"
                      buildVersionToDownload: specific
                      pipelineId: ${{ parameters.releaseBuildId }}
                      artifactName: release-candidate
                      targetPath: $(Pipeline.Workspace)/release-input
                  - bash: |
                      set -euo pipefail
                      python -m pip install PyYAML
                      python tools/ado_integration.py acquire --output dist
                    name: candidate
                    displayName: Check candidate
                    env:
                      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                      OPS_RELEASE_BUILD_ID: ${{ parameters.releaseBuildId }}
                      OPS_RELEASE_INPUT: $(Pipeline.Workspace)/release-input
              - bash: >-
                  python tools/ado_integration.py inventory
                  --output "$(Build.SourcesDirectory)/dependency-inventory/build"
                condition: succeededOrFailed()
                displayName: Record dependencies
              - template: release-feed.yml
                parameters:
                  condition: succeededOrFailed()
              - publish: dist
                displayName: Publish wheel
                artifact: ops-wheel-$(System.JobAttempt)

      - stage: Lint
        dependsOn: Plan
        jobs:
          - job: Lint
            timeoutInMinutes: 30
            steps:
              - task: UsePythonVersion@0
                displayName: Select Python
                inputs:
                  versionSpec: '3.13'
              - bash: |
                  set -euo pipefail
                  python -m pip install tox
                  python -m tox run -e lint
                  .tox/lint/bin/python -m flake8 tools/ado_integration.py tools/ado_cluster.py tools/ado_auth.py --config setup.cfg
                  .tox/lint/bin/python -m pylint tools/ado_integration.py tools/ado_cluster.py tools/ado_auth.py --rcfile .pylintrc
                  .tox/lint/bin/python -m flake8 tools/ado_diagnostics.py --config setup.cfg
                  .tox/lint/bin/python -m pylint tools/ado_diagnostics.py --rcfile .pylintrc
                  .tox/lint/bin/python -m flake8 tools/integration_health.py --config setup.cfg
                  .tox/lint/bin/python -m pylint tools/integration_health.py --rcfile .pylintrc
                  .tox/lint/bin/python -m flake8 tools/release_pipeline.py --config setup.cfg
                  .tox/lint/bin/python -m pylint tools/release_pipeline.py --rcfile .pylintrc
                displayName: Run Lint
              - bash: >-
                  .tox/lint/bin/python tools/ado_integration.py inventory
                  --output "$(Build.SourcesDirectory)/dependency-inventory/lint"
                condition: succeededOrFailed()
                displayName: Record dependencies
              - template: release-feed.yml
                parameters:
                  condition: succeededOrFailed()

      - stage: Unit
        displayName: Unit
        dependsOn: Plan
        jobs:
          - job: Unit
            timeoutInMinutes: 60
            steps:
              - task: UsePythonVersion@0
                displayName: Select Python
                inputs:
                  versionSpec: '3.13'
              - bash: |
                  set -euo pipefail
                  python -m pip install tox
                  python -m tox run -e clean,python,report
                  echo "##vso[task.setvariable variable=coverageArtifact;isOutput=true]ops-unit-coverage-$SYSTEM_JOBATTEMPT"
                name: unit
                displayName: Run unit tests
              - bash: |
                  set -euo pipefail
                  extension=$(.tox/python/bin/python -c \
                    'import sysconfig; print(sysconfig.get_paths()["purelib"] + "/azure-cli-extensions/azure-iot-ops")')
                  .tox/python/bin/python tools/ado_integration.py inventory \
                    --output "$(Build.SourcesDirectory)/dependency-inventory/unit" --extension-dir "$extension"
                condition: succeededOrFailed()
                displayName: Record dependencies
              - template: release-feed.yml
                parameters:
                  condition: succeededOrFailed()
              - task: PublishTestResults@2
                displayName: Publish results
                condition: always()
                inputs:
                  testResultsFormat: JUnit
                  testResultsFiles: junit/test-aziotops-ext-unit.xml
                  testRunTitle: Unit attempt $(System.JobAttempt)
                  failTaskOnFailedTests: true
                  failTaskOnMissingResultsFile: true
              - publish: .coverage
                displayName: Publish coverage
                condition: succeeded()
                artifact: ops-unit-coverage-$(System.JobAttempt)

      - stage: Integration
        displayName: Integration
        dependsOn: [Plan, Build, Lint]
        condition: and(succeeded(), eq(dependencies.Plan.outputs['Plan.plan.hasParallel'], 'true'))
        variables:
          planArtifact: $[ stageDependencies.Plan.Plan.outputs['plan.artifact'] ]
          candidateArtifact: $[ stageDependencies.Build.Build.outputs['candidate.artifact'] ]
          candidateDigest: $[ stageDependencies.Build.Build.outputs['candidate.digest'] ]
        jobs:
          - template: integration-scenario.yml
            parameters:
              configuration: ${{ parameters }}
              matrix: $[ stageDependencies.Plan.Plan.outputs['plan.parallelMatrix'] ]

      - stage: TrustBundle
        displayName: Trust Bundle
        dependsOn: [Plan, Build, Lint]
        condition: and(succeeded(), eq(dependencies.Plan.outputs['Plan.plan.hasTrustBundle'], 'true'))
        variables:
          planArtifact: $[ stageDependencies.Plan.Plan.outputs['plan.artifact'] ]
          candidateArtifact: $[ stageDependencies.Build.Build.outputs['candidate.artifact'] ]
          candidateDigest: $[ stageDependencies.Build.Build.outputs['candidate.digest'] ]
        jobs:
          - template: integration-scenario.yml
            parameters:
              configuration: ${{ parameters }}
              matrix: $[ stageDependencies.Plan.Plan.outputs['plan.trustBundleMatrix'] ]

      - stage: Qualify
        displayName: Results
        dependsOn: [Plan, Build, Lint, Unit, Integration, TrustBundle]
        condition: >-
          and(not(canceled()), eq(dependencies.Plan.result, 'Succeeded'),
          eq(dependencies.Build.result, 'Succeeded'), eq(dependencies.Lint.result, 'Succeeded'),
          eq(dependencies.Unit.result, 'Succeeded'),
          in(dependencies.Integration.result, 'Succeeded', 'Skipped'),
          in(dependencies.TrustBundle.result, 'Succeeded', 'Skipped'))
        variables:
          planArtifact: $[ stageDependencies.Plan.Plan.outputs['plan.artifact'] ]
          candidateArtifact: $[ stageDependencies.Build.Build.outputs['candidate.artifact'] ]
          candidateDigest: $[ stageDependencies.Build.Build.outputs['candidate.digest'] ]
          unitCoverageArtifact: $[ stageDependencies.Unit.Unit.outputs['unit.coverageArtifact'] ]
        jobs:
          - job: Gate
            displayName: Results
            steps:
              - task: UsePythonVersion@0
                displayName: Select Python
                inputs:
                  versionSpec: '3.13'
              - task: DownloadPipelineArtifact@2
                displayName: Download artifacts
                inputs:
                  buildType: current
                  targetPath: $(Pipeline.Workspace)/history
              - bash: |
                  set -euo pipefail
                  python -m pip install PyYAML coverage
                  python tools/ado_integration.py gate --output qualification
                displayName: Check results
                env:
                  OPS_RELEASE_BUILD_ID: ${{ parameters.releaseBuildId }}
                  OPS_CANDIDATE: $(Pipeline.Workspace)/history/$(candidateArtifact)
                  OPS_PLAN: $(Pipeline.Workspace)/history/$(planArtifact)/plan.json
                  OPS_HISTORY: $(Pipeline.Workspace)/history
                  OPS_CANDIDATE_DIGEST: $(candidateDigest)
                  OPS_UNIT_COVERAGE: $(Pipeline.Workspace)/history/$(unitCoverageArtifact)/.coverage
              - publish: qualification
                displayName: Publish results
                artifact: ops-qualification-$(System.JobAttempt)
              - task: PublishCodeCoverageResults@2
                displayName: Publish coverage
                inputs:
                  summaryFileLocation: qualification/coverage.xml
                  failIfCoverageEmpty: true
