parameters:
- name: cloud
  type: string
- name: version
  type: string
- name: region
  type: string
- name: services
  type: object
variables:
- name: HealthCloud
  value: ${{ parameters.cloud }}
- name: HealthTrack
  value: ${{ parameters.version }}
- name: HealthRegion
  value: ${{ parameters.region }}
- name: HealthServices
  value: ${{ join(',', parameters.services) }}
- ${{ if eq(parameters.cloud, 'public') }}:
  - name: HealthAzureCloud
    value: AzureCloud
  - name: HealthAzureServiceConnection
    value: az-iot-ops-int-sp-ado
  - name: HealthSubscription
    value: a386d5ea-ea90-441a-8263-d816368c84a1
  - name: HealthResourceGroup
    value: ops-cli-int-test-rg
  - name: HealthCustomLocationsObjectId
    value: 51dfe1e8-70c6-4de5-a08e-e18aff23d815
- ${{ if eq(parameters.cloud, 'fairfax') }}:
  - name: HealthAzureCloud
    value: AzureUSGovernment
  - name: HealthAzureServiceConnection
    value: sc-iot-ops-cli-fairfax-it
  - name: HealthSubscription
    value: a32cd71f-10e6-4c80-944c-039bdaac7cab
  - name: HealthResourceGroup
    value: ${{ format('ops-cli-monitor-fairfax-{0}', parameters.version) }}
  - name: HealthCustomLocationsObjectId
    value: ea82e15f-28d2-47d8-9abd-d3e85d70f7b5
