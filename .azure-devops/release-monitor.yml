trigger: none
pr: none
schedules: []
name: aio-owned-resource-smoke-$(MonitorCloud)-$(Build.BuildId)
appendCommitMessageToRunName: false
pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Prepare
    jobs:
      - job: Explain
        steps:
          - checkout: none
          - bash: |
              echo "##vso[build.addbuildtag]access-smoke"
              echo "##vso[build.addbuildtag]nonqualifying"
              echo "Bounded smoke in pre-existing groups; no clusters, whole-group writes or service-identity grants."
  - stage: Access
    dependsOn: Prepare
    jobs:
      - job: AIO
        pool:
          name: iotupx-ops-integration
        timeoutInMinutes: 25
        cancelTimeoutInMinutes: 10
        variables:
          SMOKE_OUTPUT: $(Agent.TempDirectory)/fixed-rg-mutation
          MONITOR_AZURE_CLOUD: $(MonitorAzureCloud)
          MONITOR_SUBSCRIPTION: $(MonitorSubscription)
          MONITOR_REGION: $(MonitorRegion)
        steps:
          - checkout: self
            clean: true
            persistCredentials: false
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.13'
          - bash: python tools/fixed_rg_mutation_smoke.py prepare
            displayName: Publish attempt identities before credentials or Azure mutations
          - publish: $(Agent.TempDirectory)/fixed-rg-mutation
            artifact: fixed-rg-original-contexts
          - task: AzureCLI@2
            displayName: Exercise exact-owner creation and cleanup
            inputs:
              azureSubscription: $(AzureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: python tools/fixed_rg_mutation_smoke.py run
          - publish: $(Agent.TempDirectory)/fixed-rg-mutation
            artifact: fixed-rg-mutation-AIO
            condition: always()
  - stage: NotQualified
    dependsOn: [Prepare, Access]
    condition: always()
    jobs:
      - job: Explain
        steps:
          - checkout: none
          - bash: |
              echo "##vso[task.logissue type=error]Bounded ownership smoke, not release-health qualification."
              exit 1
