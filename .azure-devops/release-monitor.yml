trigger: none
pr: none
schedules: []
name: aio-fixed-rg-probe-$(MonitorCloud)-$(Build.BuildId)
appendCommitMessageToRunName: false
pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Prepare
    jobs:
      - job: Explain
        steps:
          - checkout: none
          - bash: |
              echo "##vso[build.addbuildtag]access-smoke"
              echo "##vso[build.addbuildtag]nonqualifying"
              echo "Read-only existing-group and permission discovery. No resources are created or deleted."
  - stage: Access
    dependsOn: Prepare
    jobs:
      - job: AIO
        pool:
          name: iotupx-ops-integration
        timeoutInMinutes: 10
        steps:
          - checkout: self
            clean: true
            persistCredentials: false
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.13'
          - task: AzureCLI@2
            displayName: Read existing fixed groups and effective scoped permissions
            inputs:
              azureSubscription: $(AzureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: python tools/fixed_rg_access_probe.py
            env:
              SMOKE_OUTPUT: $(Agent.TempDirectory)/fixed-rg-access
              MONITOR_AZURE_CLOUD: $(MonitorAzureCloud)
              MONITOR_SUBSCRIPTION: $(MonitorSubscription)
              MONITOR_RESOURCE_GROUP: $(MonitorResourceGroup)
          - publish: $(Agent.TempDirectory)/fixed-rg-access
            artifact: fixed-rg-access-AIO
            condition: always()
  - stage: NotQualified
    dependsOn: [Prepare, Access]
    condition: always()
    jobs:
      - job: Explain
        steps:
          - checkout: none
          - bash: |
              echo "##vso[task.logissue type=error]Read-only access probe, not release-health qualification."
              exit 1
