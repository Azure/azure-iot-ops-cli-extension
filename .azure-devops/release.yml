trigger: none
pr: none
name: ops-release-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: mode
    displayName: Mode
    type: string
    default: Plan
    values: [Plan, Validate, Release]
  - name: sourceBranch
    displayName: Source branch
    type: string
    default: dev
  - name: createIndexPr
    displayName: Create index PR
    type: boolean
    default: false
  - name: uploadWheel
    displayName: Upload wheel
    type: boolean
    default: false

resources:
  repositories:
    - repository: governedTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/stable

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@governedTemplates
  parameters:
    pool:
      name: iotupx-1espt-release-probe
      image: iotupx-1espt-ubuntu2404
      os: linux
    sdl:
      sourceAnalysisPool:
        name: iotupx-1espt-release-probe
        image: iotupx-1espt-windows2025
        os: windows
    stages:
      - template: templates/release-stages.yml
        parameters: ${{ parameters }}
