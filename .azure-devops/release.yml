trigger: none
pr: none
name: ops-release-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: mode
    displayName: Plan checks governance; Validate runs live tests; Release also publishes
    type: string
    default: Plan
    values: [Plan, Validate, Release]
  - name: sourceBranch
    displayName: Candidate source branch (Release requires protected dev)
    type: string
    default: dev
  - name: createIndexPr
    displayName: Submit an extension-index PR after GitHub publication (Release only)
    type: boolean
    default: false
  - name: uploadWheel
    displayName: Also upload the wheel to approved Azure Storage (Release only)
    type: boolean
    default: false

resources:
  repositories:
    - repository: governedTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/stable

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@governedTemplates
  parameters:
    pool:
      name: iotupx-1espt-release-probe
      image: iotupx-1espt-ubuntu2404
      os: linux
    sdl:
      sourceAnalysisPool:
        name: iotupx-1espt-release-probe
        image: iotupx-1espt-windows2025
        os: windows
    stages:
      - template: templates/release-stages.yml
        parameters: ${{ parameters }}
