trigger: none
pr: none
name: ops-release-$(Date:yyyyMMdd).$(Rev:r)

resources:
  repositories:
    - repository: governedTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/stable

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@governedTemplates
  parameters:
    pool:
      name: iotupx-1espt-release-probe
      image: iotupx-1espt-ubuntu2404
      os: linux
    sdl:
      sourceAnalysisPool:
        name: iotupx-1espt-release-probe
        image: iotupx-1espt-windows2025
        os: windows
    stages:
      - stage: MigrationNotImplemented
        displayName: Release migration starter - not implemented
        jobs:
          - job: RejectUnimplementedPipeline
            steps:
              - checkout: none
              - bash: |
                  echo "##vso[task.logissue type=error]Ops release migration is not implemented. No candidate is qualified and publication is unavailable."
                  exit 1
                displayName: Reject incomplete release qualification
