# Test scenario configuration for integration tests
# Parsed by workflows/int_test.yml
# config options:
#   - name: Scenario identifier
#   - description: Test step name in workflow run
#   - tox_env: Which tox environment(s) to run after init
#   - custom_only: Optional condition - only run when custom args provided
#   - needs_trust: Whether this scenario requires trust bundle setup (default: false)
#   - init_extra_args: Additional arguments to pass to `init`
#   - create_extra_args: Additional arguments to pass to `create`
#   - test_redeploy: Whether to test redeployment after initial tests (default: false)
#   - no_preflight: Disable preflight checks (default: false)

scenarios:
  - name: custom-input
    description: "Custom init/create arguments"
    tox_env: python-all-int
    custom_only: true

  - name: edge
    description: "Edge tests"
    tox_env: python-edge-int

  - name: cloud
    description: "Cloud tests (fast)"
    tox_env: python-cloud-int
    create_extra_args: "--add-insecure-listener --persist-max-size 10Gi"
    no_preflight: true

  - name: cloud-slow
    description: "Cloud tests (slow)"
    tox_env: python-cloud-slow-int

  - name: redeploy
    description: "Redeployment tests"
    test_redeploy: true

  - name: trust
    description: "Trust bundle / workload identity tests"
    tox_env: python-trust-int
    needs_trust: true
    init_extra_args: "--user-trust"
    create_extra_args: "--trust-settings configMapName=example-bundle configMapKey=trust-bundle.pem issuerKind=Issuer issuerName=selfsigned-issuer"
