# Integration test scenarios.
# Fields: name (required), description, tox_env (optional), needs_trust (bool), test_redeploy (bool), parallel (bool, default: true), init_args, create_args, env (array of single-key maps).

scenarios:
  - name: edge
    description: "Edge tests"
    tox_env: python-edge-int

  - name: insecure-listener
    description: "Insecure listener deploy, long running tests"
    tox_env: python-long-int
    create_args: "--add-insecure-listener --persist-max-size 10Gi"
    env:
      - AIO_CLI_INIT_PREFLIGHT_DISABLED: "true"

  - name: rpsaas
    description: "Cloud tests"
    tox_env: python-rpsaas-int

  - name: upgrade
    description: "Upgrade tests"
    tox_env: python-upgrade-int
    parallel: false

  - name: redeploy
    description: "Redeployment tests"
    test_redeploy: true

  - name: trustbundle
    description: "Workload identity tests"
    tox_env: python-wlif-int
    needs_trust: true
    init_args: "--user-trust"
    create_args: "--trust-settings configMapName=example-bundle configMapKey=trust-bundle.pem issuerKind=Issuer issuerName=selfsigned-issuer"
    parallel: false
