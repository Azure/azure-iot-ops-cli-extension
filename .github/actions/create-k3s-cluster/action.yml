name: 'Create a k3s cluster in your agent'
description: |
  Action to create a k3s cluster in your Github workflow.
inputs:
  version:
    required: false
    description: 'K3S version string'
    default: "v1.31.1+k3s1"
runs:
  using: 'composite'
  steps:
    - name: "Install K3S"
      env:
        K3S_VERSION: ${{ inputs.version }}
      run: |
        # vars
        release_url="https://github.com/k3s-io/k3s/releases/download"
        install_dir="/usr/local/bin/k3s"

        # install k3s
        curl -Lo $install_dir "$release_url/${{ env.K3S_VERSION }}/k3s"
        chmod a+x $install_dir
      shell: bash
    - name: "Start K3S server"
      env:
        # config
        K3S_KUBECONFIG_MODE: 644
      run: |
        # start cluster in background
        sudo k3s server --cluster-init &

        # wait for API server to accept connections
        echo "Waiting for k3s API server..."
        retry_count=0
        max_retries=30
        sleep_interval=10
        until sudo k3s kubectl get nodes &>/dev/null; do
          retry_count=$((retry_count + 1))
          if [ $retry_count -ge $max_retries ]; then
            echo "k3s API server did not become reachable after $((max_retries * sleep_interval))s."
            exit 1
          fi
          echo "Waiting for API server (attempt $retry_count/$max_retries)..."
          sleep $sleep_interval
        done

        # wait for node to be fully ready
        sudo k3s kubectl wait --for=condition=Ready node --all --timeout=300s
        echo "k3s cluster is ready."
      shell: bash
    - name: "Write cluster config"
      run: |
        mkdir ~/.kube 2> /dev/null
        sudo k3s kubectl config view --raw > ~/.kube/config
        chmod 600 ~/.kube/config
        export KUBECONFIG=~/.kube/config
      shell: bash