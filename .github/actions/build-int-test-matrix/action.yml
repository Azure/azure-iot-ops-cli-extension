name: Build Test Matrix
description: Build matrix of test scenarios from YAML config

inputs:
  config-file:
    description: Path to test scenarios YAML file
    required: false
    default: .github/test-scenarios.yml
  test-scenarios:
    description: Comma-separated list of scenarios to run
    required: false
    default: ''
  runtime-channels:
    description: Comma-separated runtime channels (stable,preview)
    default: stable,preview
  upgrade-baselines:
    description: JSON object of pinned baseline wheels and runtime identities, keyed by channel
    default: '{}'
  test-current:
    description: Test the candidate's bundled runtime profiles
    default: 'true'
  test-n-1:
    description: Discover and test the previous published GA runtime line
    default: 'false'
  test-n-2:
    description: Discover and test the second previous published GA runtime line
    default: 'false'
  runtime-init-args:
    description: Additional shared foundation arguments
    default: ''
  runtime-create-args:
    description: Additional runtime arguments, excluding channel/version/train selection
    default: ''

outputs:
  matrix:
    description: JSON array of scenarios to run
    value: ${{ steps.build.outputs.scenarios }}

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet pyyaml

    - name: Build matrix
      id: build
      shell: bash
      env:
        TEST_SCENARIO_FILE: ${{ inputs.config-file }}
        TEST_SCENARIOS: ${{ inputs.test-scenarios }}
        RUNTIME_CHANNELS: ${{ inputs.runtime-channels }}
        UPGRADE_BASELINES: ${{ inputs.upgrade-baselines }}
        TEST_CURRENT: ${{ inputs.test-current }}
        TEST_N_1: ${{ inputs.test-n-1 }}
        TEST_N_2: ${{ inputs.test-n-2 }}
        RUNTIME_INIT_ARGS: ${{ inputs.runtime-init-args }}
        RUNTIME_CREATE_ARGS: ${{ inputs.runtime-create-args }}
      run: |
        python "${{ github.action_path }}/build_matrix.py"