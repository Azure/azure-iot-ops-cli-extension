name: "[auto] Docker Build"
permissions: {}
on:
  pull_request:
    paths:
      - "Dockerfile"
  push:
    paths:
      - "Dockerfile"
jobs:
  ensure-docker-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --no-cache .