# TODO - consolidate re-used steps between int_test.yml into actions (cluster setup, etc)
name: E2E Containerized Integration tests
on:
  workflow_call:
    inputs:
      runtime-channels:
        description: "Runtime channels to test (stable,preview); each gets an independent cluster"
        type: string
        default: "stable,preview"
      resource-group:
        description: Resource group for cluster creation
        type: string
        required: true
        default: ops-cli-int-test-rg
      custom-locations-oid:
        description: Object ID of Custom Locations RP
        type: string
        required: false
        default: '51dfe1e8-70c6-4de5-a08e-e18aff23d815'
    secrets:
      # required for az login
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
  workflow_dispatch:
    inputs:
      runtime-channels:
        description: "Runtime channels to test (stable,preview)"
        type: string
        default: "stable,preview"
      resource-group:
        description: Resource group for cluster creation
        type: string
        required: true
        default: ops-cli-int-test-rg
      custom-locations-oid:
        description: Object ID of Custom Locations RP
        type: string
        required: false
        default: '51dfe1e8-70c6-4de5-a08e-e18aff23d815'

permissions:
  # required for OpenID federation
  contents: 'read'
  id-token: 'write'

env:
  RESOURCE_GROUP: "${{ inputs.resource-group }}"
  CUSTOM_LOCATIONS_OID: ${{ inputs.custom-locations-oid }}
  K3S_VERSION: "v1.31.1+k3s1"

jobs:
  build-candidate:
    name: "Build one container-test candidate for both runtime channels"
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      sha256: ${{ steps.wheel.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: "Build container channel matrix"
        id: matrix
        uses: ./.github/actions/build-int-test-matrix
        with:
          config-file: .github/test-container-scenarios.yml
          runtime-channels: ${{ inputs.runtime-channels }}
      - name: "Build and fingerprint candidate"
        id: wheel
        run: |
          python -m pip install build
          python -m build --wheel
          cd dist
          wheels=(*.whl)
          test "${#wheels[@]}" -eq 1
          sha256sum "${wheels[0]}" > SHA256SUMS
          echo "sha256=$(cut -d ' ' -f1 SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-integration-candidate
          path: dist/
          if-no-files-found: error
  test:
    name: "${{ matrix.scenario.description }}"
    needs: build-candidate
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJson(needs.build-candidate.outputs.matrix) }}
    env:
      CLUSTER_NAME: "opt${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.scenario.name }}"
      INSTANCE_NAME: "inst${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.scenario.name }}"
      CREATE_ARGS: ${{ matrix.scenario.create_args }}
      azext_edge_runtime_channel: ${{ matrix.scenario.channel }}
      azext_edge_wheel_sha256: ${{ needs.build-candidate.outputs.sha256 }}
      AZURE_EXTENSION_USE_DYNAMIC_INSTALL: "no"
    steps:
      - name: "Setup python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: "Checkout test sources and orchestration tools"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Download the shared candidate"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-integration-candidate
          path: .artifacts/candidate
      - name: "Verify and install the candidate for workflow CLI commands"
        run: |
          cd .artifacts/candidate
          sha256sum --check SHA256SUMS
          wheels=(*.whl)
          test "${#wheels[@]}" -eq 1
          export azext_edge_wheel="$PWD/${wheels[0]}"
          test "$(sha256sum "$azext_edge_wheel" | cut -d ' ' -f1)" = "$azext_edge_wheel_sha256"
          echo "azext_edge_wheel=$azext_edge_wheel" >> "$GITHUB_ENV"
          az extension add --source "$azext_edge_wheel" -y
          extension_path=$(az extension show --name azure-iot-ops --query path -o tsv)
          python "$GITHUB_WORKSPACE/tools/integration_runner.py" --verify-installed --extension-dir "$extension_path"
      - name: "Choose collision-resistant resource suffix"
        id: resources
        run: |
          echo "suffix=$(printf '%s' "$CLUSTER_NAME" | sha256sum | cut -c1-11)" >> "$GITHUB_OUTPUT"
      - name: "Create k3s cluster"
        uses: ./.github/actions/create-k3s-cluster
        with:
          version: ${{ env.K3S_VERSION }}
      - name: "Az CLI login"
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: "ARC connect cluster"
        uses: ./.github/actions/connect-arc
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}
          resource-group: ${{ env.RESOURCE_GROUP }}
          custom-locations-oid: ${{ env.CUSTOM_LOCATIONS_OID }}
      - name: "Az CLI login refresh"
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: "Run az iot ops init"
        run: |
          az iot ops init --cluster "$CLUSTER_NAME" -g "$RESOURCE_GROUP"
      - name: "Setup Cluster Resources"
        id: init_reqs
        uses: ./.github/actions/setup-cluster-resources
        with:
          suffix: ${{ steps.resources.outputs.suffix }}
          resource-group: ${{ env.RESOURCE_GROUP }}
      - name: "Run az iot ops create"
        env:
          SCHEMA_REGISTRY_ID: ${{ steps.init_reqs.outputs.SCHEMA_REGISTRY_ID }}
          ADR_NAMESPACE_ID: ${{ steps.init_reqs.outputs.ADR_NAMESPACE_ID }}
        run: |
          # The matrix supplies only the channel selector/consent flags for this scenario.
          read -r -a create_args <<< "$CREATE_ARGS"
          az iot ops create --cluster "$CLUSTER_NAME" -g "$RESOURCE_GROUP" -n "$INSTANCE_NAME" \
            --sr-resource-id "$SCHEMA_REGISTRY_ID" --ns-resource-id "$ADR_NAMESPACE_ID" "${create_args[@]}"
      - name: "Containerized tests"
        env:
          azext_edge_skip_init: "true"  # skip init tests in container
          azext_edge_init_redeployment: "false"  # ensure no redeployment in container
          azext_edge_rg: ${{ env.RESOURCE_GROUP }}
          azext_edge_cluster: ${{ env.CLUSTER_NAME }}
          azext_edge_instance: ${{ env.INSTANCE_NAME }}
        run: |
          set -euo pipefail
          # volume mounts
          azure_dir=$(realpath ~/.azure)
          kubeconfig=$(realpath ~/.kube/config)
          kubeconfig_mount=/root/.kube/config
          candidate_dir=$(dirname "$azext_edge_wheel")
          mkdir -p .artifacts/container-results
          results_dir=$(realpath .artifacts/container-results)

          # env vars
          envVars=()
          envVars+=("-e" "azext_edge_skip_init=$azext_edge_skip_init")
          envVars+=("-e" "azext_edge_init_redeployment=$azext_edge_init_redeployment")
          envVars+=("-e" "azext_edge_rg=$azext_edge_rg")
          envVars+=("-e" "azext_edge_cluster=$azext_edge_cluster")
          envVars+=("-e" "azext_edge_instance=$azext_edge_instance")
          envVars+=("-e" "azext_edge_runtime_channel=$azext_edge_runtime_channel")
          envVars+=("-e" "azext_edge_wheel=/opt/aio-candidate/$(basename "$azext_edge_wheel")")
          envVars+=("-e" "azext_edge_wheel_sha256=$azext_edge_wheel_sha256")
          envVars+=("-e" "azext_edge_junit_path=/integration-results/e2e.xml")
          envVars+=("-e" "azext_edge_coverage_file=/integration-results/.coverage")
          envVars+=("-e" "KUBECONFIG=$kubeconfig_mount")

          # Build only the test harness; the candidate is mounted, never rebuilt in the image.
          image=$(docker build . -q)
          docker run \
            --rm \
            "${envVars[@]}" \
            -v "$kubeconfig:$kubeconfig_mount:ro" \
            -v "${azure_dir}:/root/.azure" \
            -v "${candidate_dir}:/opt/aio-candidate:ro" \
            -v "${results_dir}:/integration-results" \
            --network host \
            "$image"
      - name: "Az CLI login refresh"
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: "Delete AIO resources"
        if: ${{ always() }}
        run: |
          az iot ops delete -n ${{ env.INSTANCE_NAME }} -g ${{ env.RESOURCE_GROUP }} -y --force
      - name: "Delete connected cluster"
        if: ${{ always() }}
        run: |
          az resource delete -v --name ${{ env.CLUSTER_NAME }} -g ${{ env.RESOURCE_GROUP }} --resource-type Microsoft.Kubernetes/connectedClusters --verbose
      - name: "Delete schema registry, ADR namespace and storage"
        if: ${{ always() }}
        env:
          SCHEMA_REGISTRY_ID: ${{ steps.init_reqs.outputs.SCHEMA_REGISTRY_ID }}
          ADR_NAMESPACE_ID: ${{ steps.init_reqs.outputs.ADR_NAMESPACE_ID }}
          STORAGE_ID: ${{ steps.init_reqs.outputs.STORAGE_ID }}
        run: |
          status=0
          # Match the GA API used to create the shared ADR prerequisites on both channels.
          for id in "$SCHEMA_REGISTRY_ID" "$ADR_NAMESPACE_ID"; do
            if [[ -n "$id" ]]; then
              az resource delete --id "$id" --api-version 2026-04-01 --verbose --no-wait || status=1
            fi
          done
          if [[ -n "$STORAGE_ID" ]]; then
            az resource delete --id "$STORAGE_ID" --verbose --no-wait || status=1
          fi
          exit "$status"
      - name: "Upload container results and candidate fingerprint"
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-results-${{ matrix.scenario.name }}
          path: |
            .artifacts/container-results/
            .artifacts/candidate/SHA256SUMS
          include-hidden-files: true
